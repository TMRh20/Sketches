CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y


CONFIG_THREAD_LOCAL_STORAGE=n
# Force the build system to initialize the TLS runtime tables
#CONFIG_COMPILER_OPT="-ftls-model=local-exec"
CONFIG_ARM_TRUSTZONE_M=n
CONFIG_TRUSTED_EXECUTION_NONSECURE=y
CONFIG_TRUSTED_EXECUTION_SECURE=y
CONFIG_BUILD_WITH_TFM=y

CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_PRODUCT="Zephyr Monitor"

CONFIG_LOG=n
CONFIG_LOG_MODE_IMMEDIATE=y


CONFIG_GPIO=y
CONFIG_ARDUINO_ENTRY=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
#CONFIG_MINIMAL_LIBC=n

#CONFIG_GLIBCXX_LIBCPP=y
#CONFIG_STD_CPP17=y
#CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_SPI=y

# Enable standard device model structures
CONFIG_DEVICE_DEPS=y
CONFIG_POLL=y

CONFIG_SPI_ASYNC=y
CONFIG_SPI_STM32_DMA=n

# Expand stack frames to prevent RTOS buffer overflows
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ARDUINO_API=y

CONFIG_LLEXT=n
CONFIG_LLEXT_TYPE_ELF_OBJECT=y

CONFIG_FAULT_DUMP=2
#CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_FLASH=y
CONFIG_FLASH_MAP=n
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_COUNTER=y

CONFIG_USB_DEVICE_VID=0x239A
CONFIG_USB_DEVICE_PID=0x239A

CONFIG_PRINTK=y
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LLEXT_HEAP_SIZE=256

#CONFIG_FPU=y

CONFIG_ADC=n
CONFIG_DAC=y
CONFIG_PWM=n
CONFIG_I2C_TARGET=y
#CONFIG_DMA=y
CONFIG_MEMC=y
#CONFIG_SPI_ASYNC=y
#CONFIG_SPI_STM32_INTERRUPT=y
#CONFIG_SPI_SLAVE=y
#CONFIG_CAN=y
#CONFIG_CAN_FD_MODE=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_LINE_CTRL=y
CONFIG_RTC_STM32=y

CONFIG_DEBUG=y

CONFIG_NET_SOCKETS_SOCKOPT_TLS=n

# Disable TLS credentials management
CONFIG_TLS_CREDENTIALS=n

# Disable Mbed TLS if it is no longer needed by other components
CONFIG_MBEDTLS=n
CONFIG_BOOTLOADER_MCUBOOT=n

CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y

# Allocate a system heap. Stacks need alignment, so make this 
# significantly larger than your requested stack size.
CONFIG_DYNAMIC_OBJECTS=y
CONFIG_USERSPACE=n
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=3
CONFIG_DYNAMIC_THREAD_STACK_SIZE=4096

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y

CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y


CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_CONTEXT_NET_PKT_POOL=y

CONFIG_NET_L2_VIRTUAL=n
CONFIG_NET_L2_DUMMY=y

#CONFIG_NET_L2_ETHERNET=n
#CONFIG_NET_ARP=n

CONFIG_NET_TCP_LOG_LEVEL_DBG=n
CONFIG_NET_IPV4_LOG_LEVEL_DBG=n
CONFIG_NET_CORE_LOG_LEVEL_DBG=n
CONFIG_NET_LOG=n
#CONFIG_NET_CONTEXT_LOG_LEVEL_DBG=y
CONFIG_NET_PKT_LOG_LEVEL_DBG=n

CONFIG_NET_PPP=n
CONFIG_NET_TCP_CHECKSUM=n
CONFIG_NET_UDP_CHECKSUM=n

CONFIG_POSIX_API=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=8192

CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_MAX_CONTEXTS=2

CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384
CONFIG_NET_MAX_CONN=2

CONFIG_NET_TCP_RETRY_COUNT=5


CONFIG_SYS_HEAP_VALIDATE=y

# Catch thread stack overflows immediately via hardware MPU
CONFIG_HW_STACK_PROTECTION=n

# Identify the exact thread causing issues
CONFIG_THREAD_NAME=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_ZBUS_OBSERVER_NAME=n
