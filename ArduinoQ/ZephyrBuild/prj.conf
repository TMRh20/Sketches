# Expand stack frames to prevent RTOS buffer overflows
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ARDUINO_API=y

#CONFIG_LLEXT=y
#CONFIG_LLEXT_TYPE_ELF_OBJECT=y
# Configure a small heap for allocating metadata (adjust if your sketch grows massive)
#CONFIG_LLEXT_HEAP_SIZE=64

CONFIG_FAULT_DUMP=2
CONFIG_RESET_ON_FATAL_ERROR=n
