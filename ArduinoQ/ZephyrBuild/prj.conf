CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y

#CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_STACK=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y


CONFIG_GPIO=y
CONFIG_ARDUINO_ENTRY=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MINIMAL_LIBC=n

CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_SPI=y
CONFIG_MAIN_STACK_SIZE=2048

# Enable standard device model structures
CONFIG_DEVICE_DEPS=y
CONFIG_POLL=y

CONFIG_SPI_ASYNC=y
